kind = "web"
previewPath = "/"
title = "Interactive Map"
version = "1.0.0"
id = "artifacts/map-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 22726
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/map-app run dev"

[services.env]
PORT = "22726"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/map-app", "run", "build"]
publicDir = "artifacts/map-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
